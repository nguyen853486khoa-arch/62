                        </button>
                        <button class="btn-secondary" @click="handleAction('export')">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                            Export Data
                        </button>

                        <!-- Watchlist -->
                        <div class="section-label">Watchlist</div>
                        <div
                            v-for="item in watchlist"
                            :key="item.id"
                            class="watchlist-item"
                            @click="$router.push('/detail/' + item.id)"
                            style="cursor:pointer;"
                        >
                            <div class="flex-col">
                                <span class="name">{{ item.name }}</span>
                                <span class="text-xs text-secondary">{{ item.symbol }}</span>
                            </div>
                            <div class="flex-col" style="align-items:flex-end;">
                                <span class="price">{{ item.price }}</span>
                                <span class="change" :class="item.change >= 0 ? 'up' : 'down'">
                                    {{ item.change >= 0 ? '+' : '' }}{{ item.change }}%
                                </span>
                            </div>
                        </div>
                    </div>
                `,
                setup() {
                    const router = useRouter();
                    const password = ref('');
                    const md5Hash = ref('');

                    // Watchlist demo data
                    const watchlist = ref([
                        { id: 1, name: 'Bitcoin', symbol: 'BTC', price: '$67,432', change: 2.34 },
                        { id: 2, name: 'Ethereum', symbol: 'ETH', price: '$3,892', change: -1.12 },
                        { id: 3, name: 'Solana', symbol: 'SOL', price: '$172.5', change: 5.67 }
                    ]);

                    const strengthPercent = computed(() => {
                        const p = password.value;
                        let score = 0;
                        if (p.length >= 6) score += 25;
                        if (p.length >= 10) score += 15;
                        if (/[A-Z]/.test(p)) score += 20;
                        if (/[0-9]/.test(p)) score += 20;
                        if (/[^A-Za-z0-9]/.test(p)) score += 20;
                        return Math.min(score, 100);
                    });

                    const strengthColor = computed(() => {
                        const s = strengthPercent.value;
                        if (s < 30) return '#dc2626';
                        if (s < 60) return '#f59e0b';
                        if (s < 85) return '#3b82f6';
                        return '#16a34a';
                    });

                    const strengthLabel = computed(() => {
                        const s = strengthPercent.value;
                        if (!password.value) return '—';
                        if (s < 30) return 'Weak';
                        if (s < 60) return 'Fair';
                        if (s < 85) return 'Good';
                        return 'Strong';
                    });

                    watch(password, (val) => {
                        md5Hash.value = val ? md5(val) : '';
                    });

                    function handleAction(type) {
                        // Simple feedback for demo
                        alert(type === 'scan' ? 'Scan QR Code triggered' : 'Export Data triggered');
                    }

                    return { password, md5Hash, strengthPercent, strengthColor, strengthLabel, watchlist, handleAction };
                }
            };

            // ---- Settings Page ----
            const SettingsPage = {
                name: 'SettingsPage',
                template: `
                    <div class="page-padding">
                        <div class="page-title">Settings</div>

                        <div class="section-label">App Information</div>
                        <div class="settings-row">
                            <span class="label">App Name</span>
                            <span class="value">{{ appName }}</span>
                        </div>
                        <div class="settings-row">
                            <span class="label">Bundle ID</span>
                            <span class="value">{{ identifier }}</span>
                        </div>
                        <div class="settings-row">
                            <span class="label">Platform</span>
                            <span class="value">{{ platform }}</span>
                        </div>
                        <div class="settings-row">
                            <span class="label">Email</span>
                            <span class="value">{{ email }}</span>
                        </div>

                        <div class="section-label">Preferences</div>
                        <div class="settings-row">
                            <span class="label">Notifications</span>
                            <span class="value" style="color: var(--primary-base); font-weight:600;">On</span>
                        </div>
                        <div class="settings-row">
                            <span class="label">Language</span>
                            <span class="value">English</span>
                        </div>
                        <div class="settings-row">
                            <span class="label">Version</span>
                            <span class="value">1.0.0</span>
                        </div>

                        <button class="btn-secondary mt-lg" @click="clearCache">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                            Clear Cache
                        </button>
                    </div>
                `,
                setup() {
                    const appName = ref(window.appInformation.name || '—');
                    const identifier = ref(window.appInformation.identifier || '—');
                    const platform = ref(window.appInformation.platform || '—');
                    const email = ref(window.appInformation.email || '—');

                    function clearCache() {
                        alert('Cache cleared');
                    }

                    return { appName, identifier, platform, email, clearCache };
                }
            };

            // ---- Detail Page (example of a secondary page) ----
            const DetailPage = {
                name: 'DetailPage',
                template: `
                    <div class="page-padding">
                        <button class="detail-back" @click="$router.back()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                            Back
                        </button>
                        <div class="page-title">{{ item.name }} ({{ item.symbol }})</div>
                        <div class="card flex-col" style="gap: 12px; align-items:center;">
                            <div style="font-size: 36px; font-weight: 700; color: var(--primary-base);">{{ item.price }}</div>
                            <div class="change" :class="item.change >= 0 ? 'up' : 'down'" style="font-size: 18px; font-weight: 600;">
                                {{ item.change >= 0 ? '+' : '' }}{{ item.change }}% today
                            </div>
                        </div>
                        <div class="card">
                            <div class="section-label" style="margin-top:0;">About</div>
                            <p class="text-sm text-secondary" style="line-height:1.6;">
                                {{ item.name }} is a decentralized digital asset. The price is shown for demonstration purposes only.
                            </p>
                        </div>
                    </div>
                `,
                setup() {
                    const route = useRoute();
                    const id = parseInt(route.params.id, 10);
                    const all = [
                        { id: 1, name: 'Bitcoin', symbol: 'BTC', price: '$67,432', change: 2.34 },
                        { id: 2, name: 'Ethereum', symbol: 'ETH', price: '$3,892', change: -1.12 },
                        { id: 3, name: 'Solana', symbol: 'SOL', price: '$172.5', change: 5.67 }
                    ];
                    const item = all.find(x => x.id === id) || all[0];
                    return { item };
                }
            };

            // ------------------------------------------------------------
            // 3. AppRoot (layout with bottom tab bar conditional)
            // ------------------------------------------------------------
            const AppRoot = {
                name: 'AppRoot',
                template: `
                    <div style="display:flex; flex-direction:column; min-height:100vh; min-height:100dvh;">
                        <router-view v-slot="{ Component }">
                            <transition name="fade" mode="out-in">
                                <component :is="Component" />
                            </transition>
                        </router-view>

                        <!-- Bottom tab bar: only show when NOT on Loading page -->
                        <nav class="tab-bar" v-if="showTabBar">
                            <router-link
                                v-for="tab in tabs"
                                :key="tab.path"
                                :to="tab.path"
                                class="tab-item"
                                :class="{ active: isActive(tab.path) }"
                            >
                                <span v-html="tab.icon"></span>
                                <span>{{ tab.label }}</span>
                            </router-link>
                        </nav>
                    </div>
                `,
                setup() {
                    const route = useRoute();

                    const tabs = [
                        {
                            path: '/home',
                            label: 'Home',
                            icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>'
                        },
                        {
                            path: '/toolbox',
                            label: 'Toolbox',
                            icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>'
                        },
                        {
                            path: '/settings',
                            label: 'Settings',
                            icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>'
                        }
                    ];

                    const showTabBar = computed(() => {
                        const p = route.path;
                        // Hide tab bar on loading and detail pages
                        return p !== '/loading' && p !== '/' && !p.startsWith('/detail');
                    });

                    function isActive(path) {
                        return route.path === path;
                    }

                    return { tabs, showTabBar, isActive };
                }
            };

            // ------------------------------------------------------------
            // 4. Router configuration
            // ------------------------------------------------------------
            const routes = [
                { path: '/', redirect: '/loading' },
                { path: '/loading', component: LoadingPage },
                { path: '/home', component: HomePage },
                { path: '/toolbox', component: ToolboxPage },
                { path: '/settings', component: SettingsPage },
                { path: '/detail/:id', component: DetailPage }
            ];

            const router = createRouter({
                history: createWebHashHistory(),
                routes
            });

            // ------------------------------------------------------------
            // 5. Mount app
            // ------------------------------------------------------------
            const app = createApp(AppRoot);
            app.use(router);
            app.mount('#app');
        })();
    </script>
</body>
</html>
